[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modular_neural_network"
version = "0.1.0"
description = "A neural_network_framework built from scratch using NumPy"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "framework_files*",
    "XOR_files*",
    "Iris_files*",
    "MNIST_files*"
]